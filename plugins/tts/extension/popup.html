<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<style>
			body {
				width: 280px;
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
				padding: 16px;
				margin: 0;
				background: #18181b;
				color: #fafafa;
				box-sizing: border-box;
			}
			h3 {
				margin: 0 0 12px 0;
				font-size: 15px;
				display: flex;
				align-items: center;
				gap: 6px;
				font-weight: 600;
			}
			label {
				display: block;
				font-size: 11px;
				color: #a1a1aa;
				margin-bottom: 4px;
			}
			input {
				width: 100%;
				padding: 6px 8px;
				background: #27272a;
				border: 1px solid #3f3f46;
				border-radius: 6px;
				color: #fff;
				font-size: 12px;
				box-sizing: border-box;
				margin-bottom: 12px;
			}
			input:focus {
				outline: none;
				border-color: #3b82f6;
			}
			.btn-group {
				display: flex;
				flex-direction: column;
				gap: 8px;
			}
			button {
				width: 100%;
				padding: 8px 12px;
				border: none;
				border-radius: 6px;
				cursor: pointer;
				font-size: 12px;
				font-weight: 500;
				transition:
					background 0.15s,
					opacity 0.15s;
				display: flex;
				align-items: center;
				justify-content: center;
				gap: 6px;
			}
			.btn-primary {
				background: #2563eb;
				color: white;
			}
			.btn-primary:hover {
				background: #1d4ed8;
			}
			.btn-secondary {
				background: #27272a;
				color: #e4e4e7;
				border: 1px solid #3f3f46;
			}
			.btn-secondary:hover {
				background: #3f3f46;
			}
			#msg {
				margin-top: 12px;
				font-size: 12px;
				min-height: 18px;
				text-align: center;
				line-height: 1.4;
				word-break: break-all;
			}
			.hint {
				margin-top: 12px;
				font-size: 11px;
				color: #71717a;
				line-height: 1.4;
				border-top: 1px solid #27272a;
				padding-top: 8px;
			}
		</style>
	</head>
	<body>
		<h3><span>🔊</span> TTS 多源语音凭证同步</h3>
		<div>
			<label for="server-url">本地 pi-web-ui 地址</label>
			<input id="server-url" type="text" value="http://127.0.0.1:8787" placeholder="http://127.0.0.1:8787" />
		</div>
		<div class="btn-group">
			<button id="btn-sync-all" class="btn-primary">🚀 一键提取全部 (豆包 + DeepSeek)</button>
			<button id="btn-sync-doubao" class="btn-secondary">⚡ 仅同步豆包凭据 (doubao.com)</button>
			<button id="btn-sync-deepseek" class="btn-secondary">⚡ 仅同步 DeepSeek 凭据 (chat.deepseek.com)</button>
		</div>
		<div id="msg"></div>
		<div class="hint">在当前浏览器中登录过豆包或 DeepSeek 后，点击上方按钮即可瞬间完成凭据上报。</div>
		<script src="popup.js"></script>
	</body>
</html>
